<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <script>
      ;(function redirectToApplication(location) {
        const projectPathSegments = 1
        const basePath =
          location.pathname.split('/').slice(0, projectPathSegments + 1).join('/') + '/'
        const routePath = location.pathname
          .slice(1)
          .split('/')
          .slice(projectPathSegments)
          .join('/')
          .replace(/&/g, '~and~')
        const query = location.search
          ? '&' + location.search.slice(1).replace(/&/g, '~and~')
          : ''

        location.replace(
          location.protocol +
            '//' +
            location.host +
            basePath +
            '?/' +
            routePath +
            query +
            location.hash,
        )
      })(window.location)
    </script>
  </head>
  <body>
    <p>Redirecting to the application…</p>
  </body>
</html>

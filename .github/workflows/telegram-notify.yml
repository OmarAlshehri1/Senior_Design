name: Telegram Push Notifications

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send Telegram notification
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          with open(os.environ["GITHUB_EVENT_PATH"]) as file:
              event = json.load(file)

          repository = os.environ["GITHUB_REPOSITORY"]
          actor = os.environ["GITHUB_ACTOR"]
          ref = os.environ["GITHUB_REF"]
          commits = event.get("commits", [])
          url = event.get("compare") or (
              f"https://github.com/{repository}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}"
          )

          lines = [
              "GitHub notification",
              f"Repository: {repository}",
              f"By: {actor}",
              f"Ref: {ref}",
          ]
          for commit in commits[:5]:
              title = commit["message"].splitlines()[0][:200]
              lines.append(f"- {commit['id'][:7]}: {title}")
          lines.append(url)

          payload = urllib.parse.urlencode({
              "chat_id": os.environ["CHAT_ID"],
              "text": "\n".join(lines)[:4000],
          }).encode()

          endpoint = (
              "https://api.telegram.org/bot"
              + os.environ["BOT_TOKEN"]
              + "/sendMessage"
          )
          try:
              with urllib.request.urlopen(
                  endpoint, data=payload, timeout=30
              ) as response:
                  result = json.load(response)
              if not result.get("ok"):
                  raise ValueError("Telegram rejected the message")
          except Exception:
              raise SystemExit(
                  "Telegram notification failed. Check the bot token and chat ID."
              ) from None
          PY
